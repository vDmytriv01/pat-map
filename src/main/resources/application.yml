server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pat_map
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: cGF0LW1hcC1qd3Qtc2VjcmV0LXBsZWFzZS1jaGFuZ2UtMTIzNDU2Nzg5MA==
  expiration: 3600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
